schema_version: 1

context:
  name: ssort
  version: "0.18.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ssort-${{ version }}.tar.gz
  sha256: 49a1c4bf6b9d3b89e9ade237cb07d61923ee534d8fac2dfe19e7698e79c1e38a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - ssort = ssort._main:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61.2
  run:
    - pathspec >=0.9.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ssort
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ssort --help

about:
  summary: The python statement sorter
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/bwhmather/ssort

extra:
  recipe-maintainers:
    - thewchan
